name: 资源投稿
description: 提交资产库、策略包或种植方案供审核。
title: '[资源投稿] '
body:
  - type: markdown
    attributes:
      value: |
        第一次投稿？先看一份完整填写示例：
        [资产库（VFA）](https://github.com/Mr-Pardon/verdflow-resources/blob/main/docs/submission-examples/assets.md) ·
        [策略（VFS）](https://github.com/Mr-Pardon/verdflow-resources/blob/main/docs/submission-examples/strategies.md) ·
        [种植方案（VFP）](https://github.com/Mr-Pardon/verdflow-resources/blob/main/docs/submission-examples/plans.md)

        示例取自已发布资源，请填写你自己的文件、署名和授权情况，不要原样提交。
        无需编写 resource.json，也无需自行计算文件大小或 SHA-256；维护者审核时会整理并核验。
  - type: dropdown
    id: type
    attributes:
      label: 资源类型
      options:
        - 资产库（VFA）
        - 策略（VFS）
        - 种植方案（VFP）
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 资源名称与版本
      description: 填写便于识别的名称和本次投稿版本；更新已有资源时附上原条目链接。
      placeholder: 例如：草坪点景组团 / 1.0.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 介绍与预览图
      description: 用途、适用范围、实际验证的环境和注意事项。
      placeholder: |
        主要用途：
        适用平台与实际验证环境：
        使用限制或注意事项：
        预览图：可拖入图片，或粘贴可公开查看的图片链接。
    validations:
      required: true
  - type: textarea
    id: download
    attributes:
      label: 包文件链接与关联资源
      description: 提供无需私人账号即可获取的包文件链接（下载密码可注明）。VFA 另附配套 PAK 外链；VFS 说明是否绑定素材；VFP 注明所用策略、来源资产库及模型准备方式。暂未收录的关联资源可写名称与版本。
      placeholder: |
        VFA / VFS / VFP 文件下载链接：
        关联资源名称、版本及链接（如有）：
        PAK 外部入口与提取码（仅在需要时填写）：
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者署名
      description: 希望公开展示的个人昵称或组织名称；不是电脑用户名或私人邮箱。
      placeholder: 你的公开署名
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: 许可与素材来源
      description: 说明你有权分发的内容、许可和第三方资源的授权限制。
      placeholder: |
        自行创作的内容与采用的许可：
        第三方模型、缩略图或 PAK 的来源和授权：
        不随包分发、需用户另行准备的内容：
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 投稿确认
      options:
        - label: 已移除私人路径、项目资料与凭据，确认拥有所提交内容的分发权。
          required: true
        - label: 理解资源收录不代表策略安全认证，也不会自动授予客户端执行信任。
          required: true
